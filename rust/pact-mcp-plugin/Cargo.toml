[package]
name = "pact-mcp-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pact-mcp-plugin"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
rmcp = { version = "2.2", features = ["client", "transport-child-process", "server", "transport-io"] }
futures = "0.3"

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[dev-dependencies]
glob = "0.3"
