name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PACT_DO_NOT_TRACK: "true"
  # CI provisions the engine from source (below), never from a release.
  PACT_MCP_SKIP_INSTALL: "true"
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Several Rust integration tests spawn REAL @modelcontextprotocol/sdk Node
      # clients/servers from these example dirs, each needing its own installed
      # node_modules (consumer_stdio_mock -> consumer-stdio-mock,
      # grpc_bootstrap http mock -> consumer-http-mock, verify/http -> fixtures).
      - name: Install example MCP client/server node deps
        run: |
          for d in examples/fixtures examples/consumer-stdio-mock examples/consumer-http-mock; do
            npm ci --prefix "$d"
          done
      # The conformance suite is the anti-divergence gate (docs/spec/conformance):
      # run it as its own named step so a failure is unmistakable.
      - name: Conformance gate
        run: cargo test --manifest-path rust/Cargo.toml --test conformance
      - name: Test
        run: cargo test --manifest-path rust/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets

  windows-build:
    name: Windows build (compile smoke)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # Full stdio/HTTP E2E tests are exercised on Linux/macOS; on Windows we
      # verify the engine compiles so releases build cleanly for that target.
      - name: Build
        run: cargo build --manifest-path rust/Cargo.toml --release

  ts-adapter:
    name: TypeScript adapter (end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install fixture MCP servers
        run: npm ci --prefix examples/fixtures
      - name: Install adapter deps
        run: npm ci --prefix adapters/ts/pact-mcp
      # npm test's globalSetup builds the engine (release) and installs it to
      # ~/.pact/plugins, then the suite drives the stock pact-js Verifier E2E,
      # provider states, multi-interaction pacts, resources/prompts, and the
      # conformance fixtures — all against real MCP clients/servers.
      - name: Test (E2E incl. standard pact-js Verifier)
        run: npm test --prefix adapters/ts/pact-mcp
      - name: Package (publishable tarball check)
        run: npm pack --dry-run --prefix adapters/ts/pact-mcp
