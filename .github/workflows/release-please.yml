name: release-please

# Conventional-commit driven releases. release-please maintains a "release PR"
# that bumps the version (pact-plugin.json, package.json, Cargo.toml — kept in
# lockstep) and updates CHANGELOG.md. Merging that PR creates a GitHub Release +
# tag, which in the SAME run builds the engine for every platform and publishes
# the npm package via trusted publishing (OIDC). Keeping build+publish in this
# workflow — rather than a separate one triggered by `release: published` —
# avoids the GITHUB_TOKEN "does not trigger workflows" limitation.
on:
  push:
    branches: [main]
  # Recovery lever: build + publish for an already-created tag (e.g. if a runner
  # stalled a previous release). Skips the release-please step.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build artifacts for + publish to npm (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  pull-requests: write

env:
  PACT_DO_NOT_TRACK: "true"
  PACT_MCP_SKIP_INSTALL: "true"

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        # Uses release-please-config.json + .release-please-manifest.json.

  build-release:
    name: Build engine (${{ matrix.os }})
    needs: release-please
    # Runs on a real release (release_created) or a manual recovery dispatch.
    # always() so a skipped release-please job (on dispatch) doesn't skip this.
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # macos-latest builds BOTH osx arches (x86_64 via cross-compile), since
        # macos-13 Intel runners are unavailable on this account. ubuntu-24.04-arm
        # gives linux-aarch64 natively.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build artifacts
        run: bash scripts/release.sh ${{ runner.os }} "$RELEASE_TAG"
      - name: Upload release assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: rust/target/artifacts/*
          file_glob: true
          tag: ${{ env.RELEASE_TAG }}
          overwrite: true

  publish-npm:
    name: Publish @pactflow/pact-mcp-plugin
    needs: [release-please, build-release]
    # Publish once the artifacts are built, on a real release or a recovery
    # dispatch. always() so the skipped release-please job (dispatch) is ignored.
    if: ${{ always() && needs.build-release.result == 'success' && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    # Trusted publishing: npm authenticates via OIDC, no NPM_TOKEN secret. The
    # trusted publisher on npmjs.com must name THIS workflow file
    # (release-please.yml), since that's where `npm publish` runs.
    permissions:
      id-token: write
      contents: read
    # `npm publish` doesn't honor --prefix (it operates on the CWD), so run every
    # npm step from the package dir.
    defaults:
      run:
        working-directory: adapters/ts/pact-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing + automatic provenance need npm >= 11.5.1; Node 22
      # ships npm 10.x, so upgrade the CLI first.
      - name: Upgrade npm (OIDC support)
        run: npm install -g npm@latest
      # The release commit already carries the bumped version (release-please
      # updated package.json in the merged PR), so no version-pin step is needed.
      - name: Install deps
        run: npm ci
      # publish runs prepublishOnly (build), but build explicitly so a compile
      # failure surfaces before the publish step.
      - name: Build
        run: npm run build
      - name: Publish
        run: npm publish --access public
