name: release-please

# Conventional-commit driven releases. release-please maintains a "release PR"
# that bumps the version (pact-plugin.json, package.json, Cargo.toml — kept in
# lockstep) and updates CHANGELOG.md. Merging that PR creates a GitHub Release +
# tag, which in the SAME run builds the engine for every platform and publishes
# the npm package via trusted publishing (OIDC). Keeping build+publish in this
# workflow — rather than a separate one triggered by `release: published` —
# avoids the GITHUB_TOKEN "does not trigger workflows" limitation.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  PACT_DO_NOT_TRACK: "true"
  PACT_MCP_SKIP_INSTALL: "true"

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        # Uses release-please-config.json + .release-please-manifest.json.

  build-release:
    name: Build engine (${{ matrix.os }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm + macos-13 give linux-aarch64 and osx-x86_64 without
        # cross-compilation; the rest cover linux-x86_64, osx-aarch64, windows.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-13, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build artifacts
        run: bash scripts/release.sh ${{ runner.os }} ${{ needs.release-please.outputs.tag_name }}
      - name: Upload release assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: rust/target/artifacts/*
          file_glob: true
          tag: ${{ needs.release-please.outputs.tag_name }}
          overwrite: true

  publish-npm:
    name: Publish @pactflow/pact-mcp-plugin
    needs: [release-please, build-release]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    # Trusted publishing: npm authenticates via OIDC, no NPM_TOKEN secret. The
    # trusted publisher on npmjs.com must name THIS workflow file
    # (release-please.yml), since that's where `npm publish` runs.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing + automatic provenance need npm >= 11.5.1; Node 22
      # ships npm 10.x, so upgrade the CLI first.
      - name: Upgrade npm (OIDC support)
        run: npm install -g npm@latest
      # The release commit already carries the bumped version (release-please
      # updated package.json in the merged PR), so no version-pin step is needed.
      - name: Install deps
        run: npm ci --prefix adapters/ts/pact-mcp
      - name: Build
        run: npm run build --prefix adapters/ts/pact-mcp
      - name: Publish
        run: npm publish --prefix adapters/ts/pact-mcp --access public
